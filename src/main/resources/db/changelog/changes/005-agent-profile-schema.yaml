databaseChangeLog:
  - changeSet:
      id: 005-agent-profile-schema
      author: Wilie12
      changes:
        - createTable:
            tableName: agent_profiles
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: team_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: 'OFFLINE'
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_agent_profiles_team_id
            tableName: agent_profiles
            columns:
              - column:
                  name: team_id