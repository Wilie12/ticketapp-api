<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket Resolved</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
    <h2 th:text="'Ticket ' + ${ticketNumber} + ' has been resolved'">Ticket Created</h2>
    <p>Hello,</p>
    <p>Your support ticket has been marked as resolved by our agent.</p>
    <h3>Resolution Note:</h3>
    <blockquote style="border-left: 4px solid #4CAF50; padding-left: 10px; margin-left: 0; font-style: italic;"
            th:text="${resolutionNote}">
        The issue has been fixed.
    </blockquote>
    <p>If you have any further issues, you can reopen this ticket within the system.</p>
</body>
</html>
